android.useAndroidX=true
# The library applies the Kotlin plugin itself, as React Native apps still do.
android.builtInKotlin=false
android.newDsl=false
# The stdlib the AAR declares is pinned below (Kotlin 2.1), not the compiler's own: a consumer on an older Kotlin
# would otherwise get a 2.4 stdlib whose metadata it cannot read.
kotlin.stdlib.default.dependency=false
