// pitbox connect: points a debug build at the dev server without a dev launcher. Autolinked into React Native
// apps; uses the host app's Android Gradle and Kotlin plugins, so it declares no versions of its own.
// Everything that runs lives in the debug source set (src/debug); src/main holds only the empty package class,
// so an app's release build carries no component and no code of the library.

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def safeExt(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace 'dev.pitbox.connect'
  compileSdk safeExt('compileSdkVersion', 36)

  defaultConfig {
    minSdk safeExt('minSdkVersion', 24)
    consumerProguardFiles 'proguard-rules.pro'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  // Only for the empty package class autolinking expects; the library itself is plain Android.
  compileOnly 'com.facebook.react:react-android'
}
