# Checks on every push to main and every pull request; the release workflow runs them again on its tag.
# Device runs (yarn e2e, yarn e2e:apple) need emulators and simulators and stay local.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      # Node first, then corepack: on Windows a corepack enabled before setup-node loses to the image's yarn 1.
      # setup-node's own cache would call that yarn 1 before corepack is on, so it is off.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn compile
      # The web driver's tests run a real headless browser.
      - run: yarn playwright-core install --with-deps --only-shell chromium
      - run: yarn test

  package:
    name: npm package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - name: The package carries what its users need
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e '
            const files = new Set(require("./pack.json")[0].files.map(f => f.path));
            const need = ["dist/bin.js", "dist/index.js", "runners/android/pitbox-runner.apk",
              "runners/apple/PitboxRunner.xcodeproj/project.pbxproj", "android/build.gradle",
              "react-native.config.js", "PitboxConnect.podspec", "docs/agents.md", "docs/flows.md",
              "connect/apple/Sources/PitboxConnect/PitboxConnect.swift"];
            const missing = need.filter(f => !files.has(f));
            if (missing.length) { console.error("missing from the package: " + missing.join(", ")); process.exit(1); }
            console.log(files.size + " files");'

  swift:
    name: swift package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: swift build
      - run: swift test
      - run: pod ipc spec PitboxConnect.podspec > /dev/null

  apple-runner:
    name: apple runner for ${{ matrix.destination }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        destination: [iOS Simulator, tvOS Simulator]
    steps:
      - uses: actions/checkout@v7
      # The same build pitbox runs on a Mac on first use (src/drivers/apple/runner.ts).
      - run: >
          xcodebuild build-for-testing -project runners/apple/PitboxRunner.xcodeproj -scheme PitboxRunner
          -destination 'generic/platform=${{ matrix.destination }}' -derivedDataPath build/runner -quiet
          CODE_SIGN_IDENTITY=-

  mac-runner:
    name: mac runner and example
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # The same build pitbox runs on a Mac on first use (src/drivers/mac/runner.ts), and the example app it drives.
      - run: mkdir -p build && xcrun swiftc -O runners/apple/Mac/*.swift -o build/pitbox-mac
      - run: xcrun swiftc -Onone examples/mac/App/main.swift -o build/PitboxExample

  android:
    name: android runner and connect library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./runners/android/gradlew -p runners/android assembleRelease
      - run: ./runners/android/gradlew -p android/standalone publishToMavenLocal
